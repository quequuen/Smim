name: smim

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────
  # 공식 postgis/postgis 이미지는 arm64를 지원하지 않는다.
  # Apple Silicon(개발)과 Oracle Ampere(배포) 모두 arm64이므로
  # 멀티아키텍처 빌드인 imresamu/postgis 를 사용한다.
  postgres:
    image: imresamu/postgis:17-3.5
    container_name: smim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smim}
      POSTGRES_USER: ${POSTGRES_USER:-smim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 가 필요합니다}
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1 에만 바인딩 — 서버에 그대로 올려도 DB가 인터넷에 노출되지 않는다
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────
  # 접속자 위치·세션 같은 "지금"의 상태만 담는다. 영속 데이터는 PostGIS에 있다.
  # 재시작 후 유령 세션이 복원되지 않도록 디스크 저장을 끈다.
  #
  # 기본 구현은 PostgreSQL(트랙 B)이므로 9주차 실험 전까지는 없어도 동작한다.
  # 지금 띄우지 않으려면:  docker compose up -d postgres
  # 자세한 내용은 docs/tracks.md
  redis:
    image: redis:7.4-alpine
    container_name: smim-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 가 필요합니다}
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  postgres-data:
