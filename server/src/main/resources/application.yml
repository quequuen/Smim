spring:
  application:
    name: smim

  # 루트의 .env 를 docker compose 와 함께 읽는다 — 설정의 출처를 하나로 유지
  # 서버 배포 시에는 실제 환경변수를 쓰므로 optional
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smim}
    username: ${POSTGRES_USER:smim}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 만든다. JPA는 검증만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}

# ── 런타임 설정 ──────────────────────────────────────────────
# GET /config 가 앱에 내려주는 값. 근거는 docs/location-policy.md
# 반경은 확정값이 아니라 실험 조건이다 — 9주차 실험으로 결정한다.
smim:
  experiment:
    # hash(author_key) % 그룹 수 로 배정한다 (location-policy.md 4장). 같은 기기는 항상 같은 그룹
    # 실험을 끝내려면 확정한 그룹 하나만 남긴다 — 앱 업데이트 없이 전원이 그 값을 받는다
    # keep-radius = radius × 1.5 · move-threshold = radius 의 1/6 ~ 1/8 (location-policy.md 1-1)
    groups:
      - { name: A, radius-m: 100, keep-radius-m: 150, move-threshold-m: 15 }
      - { name: B, radius-m: 150, keep-radius-m: 225, move-threshold-m: 20 }
      - { name: C, radius-m: 300, keep-radius-m: 450, move-threshold-m: 45 }
      - { name: D, radius-m: 500, keep-radius-m: 750, move-threshold-m: 70 }
  location:
    heartbeat-sec: 45         # 서버 위치 등록 주기 · 화면 갱신과 무관
  presence:
    # 접속자 위치를 어디에 둘지. postgres(트랙 B) | redis(트랙 A, 8주차) — docs/tracks.md
    store: postgres
    stale-after: 2m           # 이보다 오래 갱신 없는 세션은 전달 대상에서 뺀다 (하트비트 45초 × 약 2.5)
    purge-after: 10m          # 5분마다 이보다 오래된 세션을 지운다
    move-tolerance-m: 10      # 이 안에서의 하트비트는 위치를 다시 쓰지 않는다 (HOT update · GPS 오차 수준)
  marker:
    window-hour: 6            # 익명 표식 구간 경계 (D4)
    area-m: 300               # "같은 구역" — 이 반경 안 최근 window-hour 의 표식을 피해 배정한다
  moderation:
    # 신고한 사람에게 그 글이 숨겨지는 것은 여기와 무관하다 — 신고 즉시, 임계치 없이 일어난다.
    # 아래 값들은 "모두에게" 가릴 때와 구역을 막을 때만 쓴다.

    # 서로 다른 기기 이만큼이 신고하면 모두에게 가린다 (status = 'hidden').
    # UNIQUE (message_id, reporter_key) 때문에 한 기기는 한 번만 신고할 수 있다 — 혼자서는 못 채운다
    blind-threshold: 5

    # 도배 제한. 이 창 안에서 이 개수를 넘겨 쓸 수 없다 (429)
    rate-window: 1m
    rate-max: 5

    # 자동 구역 차단 — 원시 신고가 아니라 '가려진 글' 기준이다.
    # 신고 1~4건으로는 절대 쌓이지 않으므로, 테스터 몇 명이 한 건물에서 신고해도 구역이 막히지 않는다
    area-threshold: 3         # 이만큼 쌓이면 그 자리를 막는다
    area-radius-m: 100        # 세는 반경 · 만들어지는 금지 구역의 반경
    area-window: 24h          # 이보다 오래된 것은 세지 않는다

  admin:
    # 관리자 API 토큰. 환경변수로만 준다 — 기본값이 없어서, 안 넣으면 /admin/** 이 전부 401 이다.
    # 설정을 빠뜨렸을 때 '열린 채'가 아니라 '닫힌 채'가 되게 한다
    token: ${SMIM_ADMIN_TOKEN:}
