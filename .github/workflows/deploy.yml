# PR 에서는 빌드·테스트만, main push 에서만 배포한다.
# 공개 저장소라 포크 PR 이 배포를 건드리면 안 된다 — deploy 잡의 if 가 그것을 막는다.
name: CI · Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest

    # @SpringBootTest 4개가 실제 DB 를 띄운다. PostGIS 확장은 Flyway V1 이 직접 만든다
    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_DB: smim
          POSTGRES_USER: smim
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smim -d smim"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 테스트와 jar 빌드
        working-directory: server
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: smim
          POSTGRES_USER: smim
          POSTGRES_PASSWORD: ci
          # 트랙 B 라 Redis 를 쓰지 않지만 RedisProperties 바인딩에 값이 필요하다
          REDIS_PASSWORD: ci
        run: ./gradlew test bootJar --no-daemon

      - name: 테스트 결과 남기기
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: server/build/reports/tests/test
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: app-jar
          path: server/build/libs/*.jar

  deploy:
    name: 배포
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: artifact

      - name: SSH 준비
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan 대신 고정한 호스트 키를 쓴다 — 매번 받아오면 중간자 공격을 못 막는다
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 올리고 교체
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 artifact/*.jar  "$TARGET:~/smim/app.jar.new"
          scp -i ~/.ssh/id_ed25519 deploy/deploy.sh "$TARGET:~/smim/deploy.sh"
          ssh -i ~/.ssh/id_ed25519 "$TARGET" 'chmod +x ~/smim/deploy.sh && ~/smim/deploy.sh'
