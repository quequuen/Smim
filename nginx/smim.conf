# api.smim.app — Nginx 역프록시. 근거: docs/scope.md 4-1 (#13)
#
# **Asker 와 같은 인스턴스를 쓴다.** 무료 ARM 한도를 Asker 가 전부 점유하고 있어 전용
# 인스턴스를 만들 수 없었고, 한 박스를 나눠 쓰면 새 용량을 요청할 일이 없어 그 문제가 사라진다.
#
#   Asker : 8080 · PostgreSQL 16 (OS 직접) 5432 · sites-available/default
#   스밈  : 8082 · PostgreSQL 17 (컨테이너) 127.0.0.1:5433 · 이 파일
#
# ── 놓을 자리 ─────────────────────────────────────────────────
#   /etc/nginx/sites-available/smim.conf  ← 이 파일
#   /etc/nginx/sites-enabled/smim.conf    ← 위로 거는 심볼릭 링크
#
# ── 처음 올릴 때 순서 ─────────────────────────────────────────
# 인증서가 없으면 아래 443 블록 때문에 nginx 가 아예 안 뜬다. 그래서 인증서가 먼저다.
# 그런데 80 포트는 Asker 의 nginx 가 이미 쓰고 있어 **--standalone 을 쓸 수 없다** —
# 끄면 심사 중인 서비스가 멈춘다. nginx 를 켜 둔 채로 받는 --webroot 를 쓴다.
#
#   1) DNS A 레코드: api.smim.app → 인스턴스 공인 IP     (#3, Cloudflare · 프록시 끄기)
#   2) sudo mkdir -p /var/www/certbot
#   3) 이 파일에서 443 블록을 뺀 :80 블록만 먼저 올리고 reload
#   4) sudo certbot certonly --webroot -w /var/www/certbot -d api.smim.app
#   5) 이 파일 전체로 교체하고  sudo nginx -t && sudo systemctl reload nginx
#
# reload 는 graceful 이라 Asker 연결이 끊기지 않는다. restart 를 쓰지 말 것.
# 갱신은 certbot 타이머가 하고, 아래 :80 의 ACME 경로를 그대로 쓴다.
#
# > .app 은 HSTS preload 라 브라우저가 http:// 접속을 거부하지만, ACME 검증은
# > Let's Encrypt 서버가 직접 평문 HTTP 로 하므로 영향을 받지 않는다.

# WebSocket 핸드셰이크만 Connection: upgrade 로 넘기고, 평범한 요청은 close 로 둔다.
# 여기서 $http_upgrade 는 클라이언트가 보낸 Upgrade 헤더다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 80 — 인증서 발급·갱신용 경로만 남기고 전부 HTTPS 로 ───────
server {
    listen      80;
    listen      [::]:80;
    server_name api.smim.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 ───────────────────────────────────────────────────────
server {
    # http2 on; 은 nginx 1.25.1+ 문법이다. 1.24 (Ubuntu 24.04) 는 listen 줄에 붙인다
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name api.smim.app;

    ssl_certificate     /etc/letsencrypt/live/api.smim.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.smim.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 글은 500자가 최대라 본문이 클 일이 없다 (CreateMessageRequest)
    client_max_body_size 8k;

    access_log /var/log/nginx/smim.access.log;
    error_log  /var/log/nginx/smim.error.log;

    # ── WebSocket — 여기가 핵심이다 ───────────────────────────
    #
    # WebSocket 은 평범한 GET 으로 시작해 "프로토콜을 바꾸자"고 요청하고,
    # 서버가 101 Switching Protocols 로 답해야 연결이 맺어진다.
    #
    #   GET /ws HTTP/1.1
    #   Upgrade: websocket        ← 바꾸자
    #   Connection: Upgrade       ← 이 말은 바로 옆 상대에게 하는 것
    #
    # 그런데 Upgrade · Connection 은 "다음 홉까지만 유효한" 헤더라서
    # 프록시는 기본적으로 전달하지 않고 삼킨다. 게다가 nginx 가 뒤로 보낼 때
    # 기본이 HTTP/1.0 인데 1.0 에는 Upgrade 개념 자체가 없다.
    #
    # 그래서 그냥 두면 Spring 은 Upgrade 헤더가 없는 평범한 GET 을 받고 400 을 돌려준다.
    # REST 는 멀쩡한데 /ws 만 조용히 실패하는 이유가 이것이다.
    location /ws {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;                          # 1.0 에는 Upgrade 가 없다
        proxy_set_header Upgrade    $http_upgrade;       # 삼키지 말고 그대로
        proxy_set_header Connection $connection_upgrade; # 뒤쪽에도 같은 말을 전달

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 연결을 몇 시간씩 열어 둔다. 기본 60초면 조용한 연결이 끊긴다.
        # STOMP 하트비트가 10초마다 오가지만(WebSocketConfig.HEARTBEAT_MS) 명시해 둔다
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── REST ──────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
